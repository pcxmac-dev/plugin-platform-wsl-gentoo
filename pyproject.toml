[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-wsl-gentoo"
version = "0.4.3"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "WSL Gentoo for Liminal: Gentoo in WSL 2 set up by the platform, with Docker inside, as a Docker instance for the framework."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.1)
dependencies = ["liminal-libs>=1.33.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
wsl-gentoo = "plugin_platform_wsl_gentoo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
